[project]
name = "osint-trader"
version = "0.1.0"
description = "AI-driven OSINT pipeline for prediction-market signals on Polymarket."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "telethon>=1.36.0",
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "tenacity>=9.0.0",
    "rich>=13.7.0",
    "aiosqlite>=0.20.0",
    "structlog>=24.1.0",
    "python-dateutil>=2.9.0",
    "rapidfuzz>=3.9.0",
]

[project.optional-dependencies]
trade = ["py-clob-client>=0.17.0", "web3>=6.20.0"]
dashboard = ["fastapi>=0.111.0", "uvicorn>=0.30.0"]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.0", "ruff>=0.5.0"]

[project.scripts]
osint-trader = "osint_trader.main:cli"
osint-backtest = "osint_trader.scripts.backtest:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
